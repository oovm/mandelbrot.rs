; rs-ddraw default configuration.
;
; This file lives next to the ddraw.dll wrapper and is read by the `[ddraw]`
; section (the crate's config module). Values here are the defaults that the
; wrapper currently parses; each key is preceded by a `;` comment describing
; its default value and meaning. Booleans accept Yes/True/1 (and No/False/0).
; Integer/string keys are read via the Windows INI API (case-insensitive).

[ddraw]

; Renderer selection: auto | gdi | opengl | openglcore | d3d9. (default: auto)
Renderer=auto

; Maintain the game's native aspect ratio when scaling to the window. (default: No)
MaintainAspectRatio=No

; Draw black bars (windowbox) around the scaled image instead of stretching. (default: No)
Windowboxing=No

; Stretch the image to fill the whole window/fullscreen. (default: No)
StretchToFullscreen=No

; Custom game resolution width override (0 = use the game-requested mode). (default: 0)
Width=0

; Custom game resolution height override (0 = use the game-requested mode). (default: 0)
Height=0

; Override the monitor refresh rate used for mode enumeration (0 = default). (default: 0)
RefreshRate=0

; Display-mode list size: 0 small, 1 mini, 2 full. (default: 0)
Resolutions=0

; Hard cap on the number of enumerated display modes (0 = no cap). (default: 0)
MaxResolutions=0

; Comma/space separated resolutions injected into the enumerated mode list. (default: "")
InjectResolution=

; Advertise a fake display mode string to the game (e.g. "640x480"). (default: "")
FakeMode=

; Fake OS version reported to the game, as "major.minor" (e.g. "6.1" = Win7).
; (default: "")
WinVersion=

; Keep the window border visible in windowed mode. (default: No)
Border=No

; Allow the user to resize the game window. (default: No)
Resizable=No

; Center-window mode: 0 never, 1 auto, 2 always. (default: 1)
center_window=1

; Center-window boolean form (maps to mode 1 when set). (default: No)
CenterWindow=No

; Initial window position X (screen coordinate). (default: -32000)
PosX=-32000

; Initial window position Y (screen coordinate). (default: -32000)
PosY=-32000

; Fake window sizes reported to the game via GetWindowRect/GetClientRect.
; (default: 0)
FakeWidth=0
FakeHeight=0

; Pin the process to a single CPU by setting the process affinity mask. (default: Yes)
SingleProcAffinity=Yes

; cnc-ddraw alias of SingleProcAffinity. (default: Yes)
SingleCPU=Yes

; Draw an on-screen FPS/statistics overlay. (default: 0)
DrawFPS=0

; Upscale filter: 0 nearest, 1 bilinear, 2 catmull-rom, 3 lanczos, 4 xBR.
; (default: nearest)
Filter=nearest

; Shader path or built-in name for the final upsample pass. (default: catmull-rom-bilinear.glsl)
Shader=catmull-rom-bilinear.glsl

; Additional shader search path. (default: "")
ShaderPath=

; Shader used for the first pass (CRT-style two-pass shaders). (default: "")
ShaderPathPass1=

; Vertical sync: sets the swap interval to 1 when enabled. (default: No)
VSync=No

; Force a minimum FPS: 0 disabled, -1 use maxfps, -2 force redraw, n cap. (default: 0)
MinFPS=0

; Target/cap FPS: -1 screen rate, 0 unlimited, n target fps. (default: 0)
MaxFPS=0

; Maximum game logic ticks/sec: -1 disabled, -2 refresh rate, 0 60Hz, n custom.
; (default: 0)
MaxGameTicks=0

; Frame limiter strategy: auto|testcooperativelevel|bltfast|unlock|peekmessage.
; (default: auto)
LimiterType=auto

; Enable the Tiberian Sun renderer/compat hacks. (default: No)
TShack=No

; Clear the backbuffer to black after each present (flipclear). (default: No)
FlipClear=No

; Show/hide problem surfaces / compatibility mode for games needing surface
; locking. (default: No)
LockSurfaces=No

; Do not activate the game window on alt-tab-like focus events. (default: No)
NoActivateApp=No

; Suppress the "not responding" dialog while the game is busy. (default: No)
FixNotResponding=No

; Do not show the compatibility warning message. (default: No)
NoCompatWarning=No

; The game handles WM_CLOSE itself, so the wrapper should not. (default: No)
GameHandlesClose=No

; Terminate the process instead of closing gracefully. (default: No)
TerminateProcess=No

; Remove the window system menu. (default: No)
RemoveMenu=No

; Work around the alt-key "stuck" state. (default: No)
FixAltKeyStuck=No

; Child-window fix level: 0-4. (default: 2)
FixChilds=2

; Scale the mouse to match the game/window resolution (adjmouse). (default: Yes)
AdjMouse=Yes

; Pin the cursor to the top-left corner (legacy mouse handling). (default: No)
LockMouseTopLeft=No

; Correct the centered-cursor offset. (default: No)
CenterCursorFix=No

; Also hook PeekMessage for frame pacing. (default: No)
HookPeekMessage=No

; Do not hook DirectInput at all (bypass the mouse wrapper). (default: No)
NoDinputHook=No

; Disable fullscreen-exclusive mode; treat DDSCL_EXCLUSIVE as windowed.
; (default: Yes)
Nonexclusive=Yes

; Hotkey: toggle fullscreen (VK code). (default: 0x0D = Enter)
ToggleFullscreen=0x0D

; Hotkey: toggle fullscreen (secondary). (default: 0)
ToggleFullscreen2=0

; Hotkey: toggle maximize (VK code). (default: 0x22 = Page Down)
ToggleMaximize=0x22

; Hotkey: toggle maximize (secondary). (default: 0)
ToggleMaximize2=0

; Hotkey: unlock the cursor (VK code). (default: 0x09 = Tab)
UnlockCursor1=0x09

; Hotkey: unlock the cursor (secondary). (default: 0xA3 = Right Ctrl)
UnlockCursor2=0xA3

; Hotkey: take a screenshot (VK code). (default: 0x7B = F12)
Screenshot=0x7B

; Hotkey: toggle the in-game config overlay (VK code, 0 = disabled).
; (default: 0x7A = F11). While the overlay is open, arrow keys navigate the
; menu, +/- adjust the selected value, R resets it to default, F is fullscreen,
; O toggles the overlay opacity, and Esc/Ctrl closes the overlay.
; (default: 0x7A = F11)
ConfigKey=0x7A

; Persist window position/size etc. back to this ini: 0 never, 1 auto, 2 always.
; (default: 1)
SaveSettings=1

; Extra guard scanlines allocated below the framebuffer for buggy games.
; (default: 200)
GuardLines=200

; Window title font minimum size (0 = default). (default: 0)
MinFontSize=0

; Below this font size, draw text using anti-aliased fonts. (default: 13)
AntiAliasedFontsMinSize=13

; Enable dev-mode debug options. (default: No)
DevMode=No

; Limit the number of GDI handles the game may leak. (default: No)
LimitGdiHandles=No

; Where screenshots are saved (directory). Empty = next to the DLL.
; (default: "")
ScreenshotDir=

; Use RGB555 (X1R5G5B5) for 16-bit primary surfaces instead of RGB565. (default: No)
rgb555=No

; Upload primary surfaces to the texture directly (fast path). (default: Yes)
PrimarySurface2Tex=Yes

; Call glFinish() after each frame. (default: No)
GlFinish=No

; Convert the frame on the GPU. (default: Yes)
ConvertOnGPU=Yes

; Use a fence-sync between frames. (default: No)
GlFenceSync=No

; Fixed display output: default|stretch|center. (default: stretch)
FixedOutput=stretch

; Target FPS pacing (0 = disabled). (default: 0)
TargetFPS=0

; Mouse-edge monitor timer (ms), used by edge scrolling hacks. (default: 0)
MonitorEdgeTimer=0

; Redraw the frame every n ticks. (default: 0)
vhack=No

; Log file name for this wrapper. (default: rs-ddraw.log)
Log=rs-ddraw.log
